<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Сообщения — Talistra</title>
    <style>
      :root { color-scheme: light; --ink:#172322; --teal:#087b75; --paper:#f5f1e8; --line:#d9dedb; }
      * { box-sizing:border-box }
      body { margin:0; background:#f7f8f6; color:var(--ink); font:14px system-ui,sans-serif }
      main { max-width:1180px; margin:auto; padding:34px 22px 70px }
      header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px }
      h1 { margin:0; font:600 34px Georgia,serif }
      button,select,input { font:inherit }
      button { cursor:pointer }
      .logout,.filter { border:1px solid var(--line); border-radius:10px; background:white; padding:9px 13px }
      .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px }
      .summary div { padding:18px; border:1px solid var(--line); border-radius:14px; background:white }
      .summary b { display:block; font-size:28px; color:var(--teal) }
      .toolbar { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:14px }
      .messages { display:grid; gap:12px }
      article { padding:20px; border:1px solid var(--line); border-radius:16px; background:white }
      article.new { border-left:4px solid var(--teal) }
      .meta { display:flex; flex-wrap:wrap; gap:8px 18px; color:#697574; font-size:12px }
      .message { margin:15px 0; white-space:pre-wrap; font-size:15px; line-height:1.55 }
      .contact { display:inline-block; padding:6px 9px; border-radius:8px; background:var(--paper) }
      .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px }
      .actions button { border:1px solid var(--line); border-radius:9px; background:#f8faf8; padding:8px 11px }
      .actions button:hover { border-color:var(--teal) }
      .actions .danger { color:#a33d32 }
      .login { max-width:410px; margin:14vh auto; padding:30px; border:1px solid var(--line); border-radius:18px; background:white; box-shadow:0 20px 60px #17232214 }
      .login h1 { margin-bottom:12px }
      .login p { color:#697574; line-height:1.5 }
      .login input { width:100%; height:48px; margin:14px 0; padding:0 13px; border:1px solid var(--line); border-radius:10px }
      .login button { width:100%; height:48px; border:0; border-radius:10px; background:var(--teal); color:white; font-weight:700 }
      .empty { padding:60px 20px; text-align:center; color:#77817f }
      .error { color:#a33d32 }
      [hidden] { display:none !important }
      @media(max-width:620px) { .summary{grid-template-columns:1fr} .toolbar{align-items:stretch;flex-direction:column} header{align-items:flex-start} }
    </style>
    <script src="./admin.js" defer></script>
  </head>
  <body>
    <section class="login" id="login">
      <h1>Talistra</h1>
      <p>Закрытая панель обратной связи.</p>
      <form id="login-form">
        <input type="password" name="password" autocomplete="current-password" placeholder="Пароль администратора" required>
        <button type="submit">Войти</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <main id="dashboard" hidden>
      <header>
        <div><small>TALISTRA</small><h1>Обратная связь</h1></div>
        <button class="logout" id="logout">Выйти</button>
      </header>
      <section class="summary">
        <div><b id="count-new">0</b><span>новых</span></div>
        <div><b id="count-read">0</b><span>в работе</span></div>
        <div><b id="count-resolved">0</b><span>обработано</span></div>
      </section>
      <div class="toolbar">
        <span id="total"></span>
        <select class="filter" id="filter" aria-label="Фильтр сообщений">
          <option value="">Все сообщения</option>
          <option value="new">Новые</option>
          <option value="read">В работе</option>
          <option value="resolved">Обработанные</option>
        </select>
      </div>
      <section class="messages" id="messages"></section>
    </main>
  </body>
</html>
