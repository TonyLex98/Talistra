[package]
name = "litra_djvu"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
djvu-rs = { version = "0.27.0", default-features = true }
jni = "0.21.1"
png = "0.18.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
